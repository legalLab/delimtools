# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # R-devel binaries on the public RSPM/P3M mirror occasionally lag
          # behind the current devel ABI (e.g. compiled dependencies such as
          # bit64 fail to dyn.load), which is an upstream mirror timing issue
          # rather than a delimtools bug. Don't let that flakiness fail CI.
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', allow-failure: true}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_DONTTEST_EXAMPLES_: FALSE

    continue-on-error: ${{ matrix.config.allow-failure == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # gdtools (pulled in transitively via ggtree -> ggiraph -> gdtools)
      # needs cairo/X11 libraries on macOS at both install time (compiled
      # code) and lazy-load time (delimtools imports ggtree). Without it,
      # loading delimtools fails with a dyld "Library not loaded:
      # /opt/X11/lib/libXrender.1.dylib" error. See build-binaries.yaml.
      - name: Install XQuartz (macOS only, needed by gdtools)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://r-forge.r-project.org/ https://pedrosenna.github.io/drat/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
