name: Build package binaries

# delimtools has NeedsCompilation: yes, but unlike packages that link
# against an external C/C++ library (e.g. via LinkingTo + pkg-config),
# all of its compiled code (abgd, asap, gmyc, mptp) lives in src/ and is
# built from Makevars with only -lm (the C math library) as a link flag.
# That means no Homebrew/MSYS2 library install or dylib/DLL bundling is
# needed for delimtools' OWN code -- R CMD INSTALL --build only requires
# a working C toolchain, which the r-lib/actions setup-r action already
# provides (Xcode CLT on macOS, Rtools on Windows).
#
# One transitive dependency needs a system library on macOS, though:
# ggtree (Imports) -> ggiraph -> gdtools, and gdtools' CRAN macOS binary
# is linked against cairo/X11 (libXrender, libcairo, ...) under
# /opt/X11/lib. GitHub's macos-latest runners don't ship that, so
# without it lazy-loading delimtools fails at namespace-load time with
# a dyld "Library not loaded: /opt/X11/lib/libXrender.1.dylib" error,
# even though nothing in delimtools' own src/ touches X11. XQuartz
# provides those libraries; see the "Install XQuartz" step below.
#
# Runs on: tag pushes (v*) and manual dispatch. Binaries are always
# uploaded as build artifacts; on a tag push they're also attached to a
# GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # macOS binary (.tgz)
  # ---------------------------------------------------------------------
  macos-binary:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # gdtools (pulled in transitively via ggtree -> ggiraph -> gdtools)
      # needs cairo/X11 libraries on macOS at both install time (it has
      # compiled code) and lazy-load time (delimtools imports ggtree,
      # which loads ggiraph, which loads gdtools). Must run before the
      # dependency-install step below, or gdtools' dyn.load() will fail
      # with "Library not loaded: /opt/X11/lib/libXrender.1.dylib".
      - name: Install XQuartz (macOS only, needed by gdtools)
        run: brew install --cask xquartz

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # ape, cli, dplyr, glue, methods, purrr, rlang, stats, stringr,
          # tidyr, tidyselect (Imports), plus Suggests (ggplot2, knitr,
          # rmarkdown, etc.). ggtree is Bioconductor and pak resolves it
          # without a bioc:: prefix.
          needs: check
          extra-packages: any::rcmdcheck

      - name: Build macOS binary package
        run: R CMD INSTALL --build --no-multiarch .
        shell: bash

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: delimtools-macOS-binary
          path: delimtools_*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Windows binary (.zip)
  # ---------------------------------------------------------------------
  windows-binary:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R and Rtools45
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          rtools-version: "45"
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - name: Build Windows binary package
        shell: bash
        run: R CMD INSTALL --build --no-multiarch .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: delimtools-windows-binary
          path: delimtools_*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Attach both binaries to the GitHub Release for this tag
  # ---------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-binary, windows-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
